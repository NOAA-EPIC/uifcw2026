Region: us-east-1
Image:
  Os: ubuntu2204 
  CustomAmi: ami-<your packer generated AMI ID here>
HeadNode:
  InstanceType: c7i.2xlarge
  Networking:
    SubnetId: subnet-<your subnet id here>
  Ssh:
    KeyName: uifcw2026 
  LocalStorage:
    RootVolume:
      Size: 500
      VolumeType: gp3
      Iops: 10000
      Throughput: 1000
  Iam:
    AdditionalIamPolicies:
      - Policy: arn:aws:iam::aws:policy/AmazonS3FullAccess
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Scheduling:
  Scheduler: slurm
  SlurmQueues:
  - Name: compute
    ComputeResources:
    - Name: c7i4xlarge
      Instances:
      - InstanceType: c7i.4xlarge
      MinCount: 0
      MaxCount: 10 
      Efa:
        Enabled: false 
    Networking:
      PlacementGroup:
        Enabled: true
      SubnetIds:
      - subnet-<your subnet id here>
SharedStorage:
  - MountDir: /scratch
    Name: ebs
    StorageType: Ebs
    EbsSettings:
      VolumeType: gp3
      DeletionPolicy: Delete
      Size: 500
