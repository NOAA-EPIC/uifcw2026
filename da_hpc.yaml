Region: us-east-1
Image:
  Os: ubuntu2204 
  CustomAmi: ami-01de1b43ea94bf578
HeadNode:
  InstanceType: c7i.2xlarge
  Networking:
    SubnetId: subnet-088f38370a401610e 
  Ssh:
    KeyName: uifcw2026 
  LocalStorage:
    RootVolume:
      Size: 500
      VolumeType: gp3
      Iops: 10000
      Throughput: 1000
  Iam:
    AdditionalIamPolicies:
      - Policy: arn:aws:iam::aws:policy/AmazonS3FullAccess
      - Policy: arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
Scheduling:
  Scheduler: slurm
  SlurmQueues:
  - Name: compute
    ComputeResources:
    - Name: c7i4xlarge
      Instances:
      - InstanceType: c7i.4xlarge
      MinCount: 0
      MaxCount: 10 
      Efa:
        Enabled: false 
    Networking:
      PlacementGroup:
        Enabled: true
      SubnetIds:
      - subnet-088f38370a401610e
SharedStorage:
  - MountDir: /scratch
    Name: ebs
    StorageType: Ebs
    EbsSettings:
      VolumeType: gp3
      DeletionPolicy: Delete
      Size: 500
